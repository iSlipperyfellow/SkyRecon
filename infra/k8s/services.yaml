apiVersion: v1
kind: Service
metadata:
  name: skyrecon-backend-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: skyrecon-backend

---
apiVersion: v1
kind: Service
metadata:
  name: skyrecon-frontend-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: skyrecon-frontend

---
apiVersion: v1
kind: Service
metadata:
  name: skyrecon-inference-service
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
  selector:
    app: skyrecon-inference

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  type: ClusterIP
  ports:
  - port: 5672
    targetPort: 5672
    protocol: TCP
  - port: 15672
    targetPort: 15672
    protocol: TCP
  selector:
    app: rabbitmq

---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
spec:
  type: ClusterIP
  ports:
  - port: 1883
    targetPort: 1883
    protocol: TCP
  - port: 9001
    targetPort: 9001
    protocol: TCP
  selector:
    app: mosquitto

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: postgres
