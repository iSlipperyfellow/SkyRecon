apiVersion: v1
kind: Service
metadata:
  name: skyrecon-backend
spec:
  type: ClusterIP
  selector:
    app: skyrecon-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: skyrecon-inference
spec:
  type: ClusterIP
  selector:
    app: skyrecon-inference
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: skyrecon-frontend
spec:
  type: LoadBalancer
  selector:
    app: skyrecon-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
