apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skyrecon-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - skyrecon.example.com
    - api.example.com
    secretName: skyrecon-tls
  rules:
  - host: skyrecon.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: skyrecon-frontend-service
            port:
              number: 3000
  - host: api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: skyrecon-backend-service
            port:
              number: 8000
