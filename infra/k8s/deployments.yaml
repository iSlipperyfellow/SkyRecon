apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyrecon-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skyrecon-backend
  template:
    metadata:
      labels:
        app: skyrecon-backend
    spec:
      containers:
      - name: backend
        image: skyrecon-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: skyrecon-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: skyrecon-secrets
              key: secret-key
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: "skyrecon.example.com,api.example.com"
        - name: RABBITMQ_HOST
          value: rabbitmq-service
        - name: MQTT_BROKER_HOST
          value: mosquitto-service
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyrecon-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skyrecon-frontend
  template:
    metadata:
      labels:
        app: skyrecon-frontend
    spec:
      containers:
      - name: frontend
        image: skyrecon-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.example.com"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.example.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyrecon-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skyrecon-inference
  template:
    metadata:
      labels:
        app: skyrecon-inference
    spec:
      containers:
      - name: inference
        image: skyrecon-inference-mock:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        - name: BACKEND_URL
          value: "http://skyrecon-backend-service:8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
